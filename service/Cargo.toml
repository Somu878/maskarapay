[package]
name = "service"
version = "0.1.0"
edition = "2021"
description = "Maskara PII redaction local inference service (ONNX Runtime + BERT token classification)"
license = "MIT"

[[bin]]
name = "service"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = true }
tokenizers = "=0.23.2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"

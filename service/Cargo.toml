[package]
name = "service"
version = "0.1.1"
edition = "2021"
description = "Maskara PII redaction local inference service (ONNX Runtime + BERT token classification)"
license = "MIT"

[[bin]]
name = "service"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = true }
tokenizers = "=0.23.2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
# `lto = "thin"` never linked in this environment: the LTO link line omits
# clang's compiler-rt (`___isPlatformVersionAtLeast` referenced by ONNX
# Runtime's CoreML Objective-C objects), so release linking failed. The gain
# on an inference-bound service is negligible; plain optimized builds are
# used instead.
lto = false
